[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/colosan/project_ithaca"

[workspace.dependencies]
ithaca-model = { path = "crates/ithaca-model" }
ithaca-ledger = { path = "crates/ithaca-ledger" }
ithaca-store = { path = "crates/ithaca-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = "0.32"
blake3 = "1"
similar = "2"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
libc = "0.2"
encoding_rs = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
